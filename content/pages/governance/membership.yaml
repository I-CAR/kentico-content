  - id: who-are-members
    type: cards
    heading: Who are I-CAR Members?
    backgroundColor: light
    paragraphs:
      - >-
        The Membership community includes all facets of the collision industry, such as vehicle manufacturers,
        repairers, insurers, technicians, equipment manufacturers, and information suppliers.
