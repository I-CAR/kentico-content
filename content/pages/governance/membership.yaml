  - id: pricing
    type: text
    heading: Membership Pricing
    backgroundColor: light
    textAlignment: start
    body:
      - >-
        Member dues must be received, or postmarked no later than December 31 of the prior year to be eligible to vote
        in the following membership term. No such member status will be effective until member dues are received.
    bodyHtml:
      - >-
        <strong>Independent Member –</strong> If you are an independent (single location) collision repair business with
        annual sales of less than $3 million, a career technical school (without an active licensing subscription), an
        individual unemployed or retired individual, employee in a business with annual sales less than or equal to $3
        million or employed by a business already with Regular Member status.<br><em>Annual Dues: $500.00</em>
      - >-
        <strong>Organizational Member –</strong> If you are a multi-shop operator with two or more locations, insurer,
        vehicle manufacturer, tool/equipment/miscellaneous supplier, and related industry organization or
        association.<br><em>Annual Dues: $1,000.00</em>
    __template:
      id: pricing
      type: text
      variant: default
      signature: 4bd1508af4f2678c0d27d8b43d1456967ec32653
