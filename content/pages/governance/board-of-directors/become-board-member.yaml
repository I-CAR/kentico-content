slug: become-board-member
title: Governance - Board of Directors - Become a Board Member
sections:
  - id: top
    type: hero
    variant: split
    backgroundColor: white
    heading: Become a Board Member
    paragraphs:
      - I-CAR is accepting applications from qualified candidates interested in
        serving on its Board of Directors. This is a meaningful opportunity to
        step into a leadership role that helps shape the strategic direction,
        governance, and long-term impact of I-CAR and the collision repair
        industry.
      - Applications are open to eligible representatives across several
        industry segments and will be reviewed in accordance with I-CAR&rsquo;s
        established nominating and election process.
    buttons:
      - label: Apply Now
        href: https://info.i-car.com/I-CAR/media/ICarMain/PDF/2026_I-CARBOD_Info-ApplicationPacket.pdf
        target: _blank
        rel: noopener noreferrer
        variant: primary
