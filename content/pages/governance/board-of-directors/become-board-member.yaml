  - id: key-dates
    type: stickyCards
    backgroundColor: white
    heading: Key Dates and Milestones
    cards:
      - heading: June 2, 2026
        body: Application deadline
      - heading: June 2026
        body: Candidate review and interviews
      - heading: August 2026
        body: Board approves candidate slate
      - heading: September 2026
        body: Slate distributed to members; alternative candidate period opens
      - heading: October 2026
        body: Electronic member vote
      - heading: December 2026
        body: Board orientation and observation meeting
  - id: apply
    type: textMedia
    variant: reverse
    backgroundColor: light
    heading: Terms and Expectations
    paragraphs:
      - Each term lasts three years, and members may serve up to two consecutive
        terms. Board members are expected to attend four meetings annually.
    list:
      variant: labeled
      items:
        - label: Winter
          value: Virtual
        - label: Spring
          value: In Person
        - label: Summer
          value: In Person
        - label: Fall
          value: In Person
