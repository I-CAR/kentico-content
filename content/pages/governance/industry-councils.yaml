slug: industry-councils
title: Governance - Industry Councils
sections:
  - id: hero
    type: hero
    heading: Industry Councils
    headingTag: h1
    variant: split
    layout:
      desktopSplit: equal
    spacing:
      paddingTop: none
    paragraphs:
      - >-
        I-CAR's industry councils provide specialized expertise and perspectives to inform decision-making, ensuring
        that our programs, services, and initiatives meet the evolving needs of the collision repair industry. Through
        these collaborative groups, I-CAR gathers insights, feedback, and guidance from industry leaders and
        professionals to drive innovation, strengthen resources, and support the adoption of best practices.
    image:
      alt: A group of diverse people putting their hands together in a circle
      urls:
        desktop:
          800w: /getmedia/fad547a3-076a-4eb5-8d99-2e922c26e50e/Hero_800w-Desktop.webp
          1600w: /getmedia/3c13b643-fc6b-4ded-bfbb-476e9f581710/Hero_1600w-Desktop.webp
        mobile:
          800w: /getmedia/d1530d39-f657-4134-94ea-d1c6f5ad12fd/Hero_800w-Mobile.webp
          1600w: /getmedia/a11f84d1-176c-49b0-bf22-10abf179f8ac/Hero_1600w-Mobile.webp
      height:
        desktop: 450
        mobile: 450
    __template:
      id: hero
      type: hero
      variant: split
      signature: b1e748887304b3a8ccf826641f8bb81f867fabe3
  - id: feedback-forums
    type: cards
    heading: Feedback Forums
    backgroundColor: light
    layout:
      variant: iconTextGrid
    cards:
      - heading: Member Council
        body:
          - >-
            Serves as the voice of the customer, offering feedback on current and future I-CAR services and programs.
            Members act as a sounding board for planning and a champion of industry adoption, goodwill, and advocacy,
            helping I-CAR align its offerings with the needs of repairers, insurers, educators, and suppliers. Current
            members include industry leaders from various segments, and members interested in joining can complete the
            membership application.
        image:
          alt: Handshake icon
          singleSource: true
          desktopSrc: /getmedia/7acd3763-c971-403d-afdb-57f674c350e3/governance-industry-councils-icon-1.png
          width: "60"
          height: "60"
          sizes: 60px
      - heading: OEM Technical Advisory
        paragraphs:
          - >-
            Identifies innovations and updates from equipment manufacturers that impact repair complexity and training
            requirements. This council helps I-CAR anticipate industry changes and ensure collision repair professionals
            have the knowledge and skills needed to address emerging vehicle technologies.
        image:
          alt: Car with checklist icon
          singleSource: true
          desktopSrc: /getmedia/44958798-8b47-40f7-8779-e8e483c1658b/governance-industry-councils-icon-4.png
          width: "60"
          height: "60"
          sizes: 60px
      - heading: Segment Advisory
        paragraphs:
          - >-
            Provides segment-specific guidance, insight, and feedback. This council ensures that I-CAR's initiatives
            address the unique needs and challenges of different sectors within the collision repair industry.
        image:
          alt: Chat bubbles icon
          singleSource: true
          desktopSrc: /getmedia/5a67c54d-1c91-4ab4-8367-90bb6b96373c/governance-industry-councils-icon-2.png
          width: "60"
          height: "60"
          sizes: 60px
      - heading: Product Development Advisory Council
        paragraphs:
          - >-
            Informs decisions around product and resource development. Its guidance helps I-CAR create tools, solutions,
            and learning materials that better serve collision repair professionals and the industry at large.
        image:
          alt: Book with lightbulb icon
          singleSource: true
          desktopSrc: /getmedia/40176a22-b398-4cc5-b590-b1f419fdbfd6/governance-industry-councils-icon-3.png
          width: "60"
          height: "60"
          sizes: 60px
