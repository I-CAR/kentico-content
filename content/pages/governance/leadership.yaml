slug: leadership
title: Governance - Leadership
sections:
  - id: hero
    type: hero
    heading: I-CAR Leadership
    headingTag: h1
    variant: split
    spacing:
      paddingTop: none
    paragraphs:
      - >-
        I-CAR's Leadership Team advances initiatives that bring our mission to life by delivering the education,
        knowledge, and solutions needed for complete, safe, quality repairs that protect consumers.
      - >-
        With a deep understanding of the collision repair ecosystem, our leaders collaborate to guide strategy,
        partnerships, and innovation across the inter-industry. Focused on talent development, training accessibility,
        and technological readiness, they ensure I-CAR remains responsive to the evolving needs of repairers,
        insurers, OEMs, educators, and suppliers. This work strengthens both the industry and the communities it
        serves.
    image:
      alt: A group of diverse people putting their hands together in a circle
