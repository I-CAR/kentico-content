  # ─── Section 3: Board Structure ──────────────────────────────────────────────
  # Source: lines 190–232. Converted from type: html.
  # image: SVG pie chart — desktopSrc only (no responsive srcset in source).
  # imageRounded: false — suppresses ic-image-rounded (pie chart, not a photo).
  # layout: desktopMediaPosition left + mobileMediaOrder below matches source
  #   order-md-last (text col) / order-md-first (image col): image left on desktop,
  #   image below text on mobile (natural DOM order, no mobile override in source).
  # list: default labeled (no columns modifier) → 2/3/2 grid from _list-block.scss.
  # VISUAL EXCEPTION: project mq(sm,only) fires at 576.1px vs Bootstrap 576px (0.1px gap);
  #   project mq max-width is 768px inclusive vs Bootstrap breakpoint at 768px (1px overlap).
  - id: board-structure
    type: textMedia
    heading: "Board Structure"
    spacing:
      paddingTop: none
    imageRounded: false
    layout:
      desktopMediaPosition: left
      mobileMediaOrder: below
    image:
      desktopSrc: "/getmedia/3f4a9eb9-521f-41aa-b456-dce6701dfcba/Board-Structure_400w.svg"
      alt: "A pie chart showing the board category structure"
      width: 745
      height: 450
    list:
      variant: labeled
      items:
        - label: "Collision Repair"
          value: "4 Representatives"
        - label: "Education"
          value: "1 Representative"
        - label: "OEM"
          value: "3 Representatives"
        - label: "Equipment, Tool and Supply"
          value: "1 Representative"
        - label: "Insurance"
          value: "3 Representatives"
        - label: "Related Services"
          value: "1 Representative"
      footnote: "The Board may appoint up to four hybrid members to provide subject matter expertise, as&nbsp;needed"

  # ─── Section 4: Board Committees ─────────────────────────────────────────────
  # Source: lines 234–288. Converted from type: html. 5 text-only cards, no images.
  # cardsPerRow: {sm:2, lg:3, xl:"auto"} approximates source col-sm-6 col-lg-4 col-xl flex-auto.
  # Minor visual diff: source h3.h4 → typed h3.ic-card-title.
  - id: board-committees
    type: cards
    backgroundColor: light
    heading: "Board Committees"
    layout:
      cardsPerRow:
        sm: 2
        lg: 3
        xl: "auto"
    cards:
      - heading: "Governance"
        body: "The Governance Committee ensures the Board operates effectively and in alignment with I‑CAR’s bylaws, policies and mission. Responsibilities include overseeing board structure, reviewing governance practices and leading regular bylaw reviews to support organizational transparency and accountability."
      - heading: "Nominating"
        body: "The Nominating Committee is responsible for identifying, vetting and recommending qualified candidates for Board positions. The committee ensures a diverse, balanced, and representative Board by aligning nominations with the needs of the inter-industry and I‑CAR’s strategic goals."
      - heading: "Finance"
        body: "The Finance Committee provides financial oversight and guidance to ensure the fiscal health of I‑CAR. This includes reviewing budgets, financial statements and investment strategies to support long-term sustainability and responsible resource management."
      - heading: "Executive"
        body: "The Executive Committee acts on behalf of the Board between full Board meetings and provides leadership on urgent or time-sensitive matters. It is composed of Board officers and is responsible for guiding strategic decisions and organizational performance in support of I‑CAR’s mission."
      - heading: "Strategic Planning"
        body: "The Strategic Planning Committee shapes long-term direction by evaluating industry trends, identifying opportunities, and prioritizing initiatives that advance the mission. Its work guides strategic goals to align with I‑CAR’s vision for collision repair education and resources."

  # ─── Section 5a: Board Member Selection Process ───────────────────────────────
  # Source: lines 290–308. Converted from type: html.
  # layout.align: start, width: narrow — matches source col-md-10 col-lg-8 col-xl-5.
  - id: board-member-selection-process
    type: text
    heading: "Board Member Selection Process"
    spacing:
      paddingBottom: none
    layout:
      align: start
      width: narrow
    list:
      variant: ordered
      items:
        - text: "Each year, I‑CAR invites its members to apply for open positions on the Board of Directors. A list of available roles is shared publicly along with the application&nbsp;deadline."
        - text: "Members interested in serving must complete an application before the&nbsp;deadline."
        - text: "A designated committee then reviews all submissions, conducts phone interviews with applicants and administers an online assessment to better understand each candidate's qualifications and&nbsp;perspective."
        - text: "Following this review, the committee provides a slate of recommended candidates to I‑CAR's regular members. Members are given a 30-day window to suggest additional candidates before the official election process&nbsp;begins."

  # ─── Section 5b: Terms and Expectations ──────────────────────────────────────
  # Source: lines 310–320. Converted from type: html (was part of board-selection section).
  # paragraphsHtml: season lines use <strong> and <br> — cannot express in plain paragraphs.
  # layout.align: start, width: narrow — matches source col-md-10 col-lg-8 col-xl-5.
  - id: terms-and-expectations
    type: text
    heading: "Terms and Expectations"
    spacing:
      paddingTop: sm
    layout:
      align: start
      width: narrow
    paragraphs:
      - "Board members are expected to attend three in-person meetings and one virtual meeting per year. Additional virtual meetings may be scheduled as needed. Attendance is critical. Missing two consecutive meetings will be considered a resignation from the Board."
    paragraphsHtml:
      - "<strong>Winter</strong> - Virtual<br><strong>Spring</strong> - In Person<br><strong>Summer</strong> - In Person<br><strong>Fall</strong> - In Person"

  # ─── Section 6: Become a Board Member ────────────────────────────────────────
  # Source: lines 326–340. Converted from type: html. Legacy trigger cleared: btn btn-primary.
  # href kept verbatim from source.
  - id: become-board-member
    type: text
    backgroundColor: light
    heading: "Become a Board Member"
    layout:
      align: start
      width: narrow
    body: "I-CAR is accepting applications from qualified candidates who are interested in serving on its Board of Directors."
    buttons:
      - label: "Learn More and Apply"
        href: "/governance/board-of-directors/become-a-board-member"
        variant: primary
        location: header
