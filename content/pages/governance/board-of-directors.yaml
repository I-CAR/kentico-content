  - id: page-hero
    type: hero
    variant: split
    imageStyle: rounded
    heading: "I‑CAR Board of Directors"
    body: "The Board of Directors guides I‑CAR’s long-term strategy and ensures alignment with its mission, keeping the organization focused on equipping the collision repair industry with the knowledge, skills, and solutions needed for complete, safe, and quality repairs."
