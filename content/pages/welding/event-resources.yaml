  - id: requirements
    type: stickyCards
    backgroundColor: light
    heading: Requirements for Welding Certification
    cards:
      - heading: General Requirements
        body:
          - Always needed for any welding certification:
        listItems:
          - OEM-approved welding equipment
          - Proper ventilation and safety gear
          - Government-issued photo ID
          - Welding helmet (auto-darkening preferred)
          - Safety glasses (must be worn at all times)
          - Welding gloves
          - Leather boots or shoes (no tennis shoes)
          - Hearing protection
        footer: Additional items may include a magnifying lens, welding cape or long-sleeve shirt, and a securely mounted vice for destructive-test welds.
      - heading: Course Requirements
        body:
          - Choose your course and review details.
        linkItems:
          - label: "Training and Certification: Steel GMA Welding"
            href: https://info.i-car.com/getmedia/2c62e01e-b971-45a3-a29d-2298cc7b226b/steel-gma-welding.pdf
            target: _blank
          - label: "Training and Certification: Steel Sectioning"
            href: https://info.i-car.com/getmedia/025ac28c-bacc-4048-a225-8e48d688df2b/steel-sectioning.pdf
            target: _blank
          - label: "Training and Certification: Aluminum GMA (MIG) Welding"
            href: http://info.i-car.com/getmedia/5f819372-4c2e-40a6-a874-c29c118f2fb0/aluminum-gma-mig-welding.pdf
            target: _blank
      - heading: Additional Guidelines
