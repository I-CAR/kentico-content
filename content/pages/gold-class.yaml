  - id: get-started
    type: leadForm
    variant: kenticoAjaxSplit
    heading: Get Your Shop to Gold Class
    paragraphs:
      - Start your body shop’s journey to success with our comprehensive Get to Gold Class package.
    list:
      - Custom training plan for your team Includes all live, online, and virtual training
      - In-Shop Knowledge Assessment to recognize existing experience
      - Monthly or annual flexible payment plans
      - Dedicated Customer Care Representative
      - 10% discount on training needed to achieve Gold Class
