              width: "800"
              height: "460"
              sizes: "(max-width: 400px) 364px, 728px"
              srcset: /getmedia/bce432da-184c-4532-b63e-1f2584995e32/CollisionRepair_400w.webp 400w, /getmedia/4baec2f2-244b-4cd5-9dff-fc2dd1ba5a0c/CollisionRepair_800w.webp 800w, /getmedia/413c7a49-629f-4f16-a822-c890cd51debe/CollisionRepair_1600w.webp 1600w
      - heading: Gold Class for Insurance
        paragraphs:
          - Insurance companies achieve Gold Class status through I‑CAR’s Professional Development Program for Auto Physical Damage Appraisers (APDAs). This specialized insurance training helps to ensure accurate estimates and proper repair procedures.
        subheading: Benefits of Being a Gold Class Insurer
        listItems:
          - Enjoy a 20% discount on professional development courses
          - Stand out as a premier vehicle insurance provider
          - Access specialized training for your team
        linkItems:
          - label: View Requirements
            href: https://info.i-car.com/gold-class/gold-class-insurance
