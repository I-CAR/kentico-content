  - id: vision-mission
    type: cards
    backgroundColor: light
    heading: Vision and Mission
    cards:
      - heading: The I‑CAR Vision
        paragraphs:
          - >-
            That every person in the collision repair industry has the information,
            knowledge and skills required to perform complete, safe and quality repairs for the ultimate
            benefit of the&nbsp;consumer.
      - heading: The I‑CAR Mission
        paragraphs:
          - >-
            To deliver increasingly accessible, on-demand and relevant education, knowledge, services
            and solutions for collision repair facilities and the related industry value&nbsp;chain.

