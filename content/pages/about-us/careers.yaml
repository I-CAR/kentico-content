  - id: workplace
    type: textMedia
    layout:
      desktopMediaPosition: left
      mobileMediaOrder: above
      desktopSplit: equal
      contentWidth: default
      mobileCopySpacing: offset
      mobileMediaSpacing: none
    heading: A Workplace Built for You
    backgroundColor: light
    paragraphs:
      - >-
        At I-CAR, a positive employee experience is at the heart of everything we do. We build trust, collaboration, and
        leadership through continuous learning and growth, creating an environment where people feel supported, engaged,
        and empowered to do their best work.
      - >-
        Grounded in integrity and collaboration, our award-winning culture connects us and drives our commitment to
        excellence across the automotive collision repair industry. We continually listen, learn, and evolve to support
        our teams, promote work-life balance, and invest in professional growth.
      - >-
        We value diverse perspectives, backgrounds, and talents, and it’s no surprise that most team members are proud
        to work at I-CAR.
    buttons:
      location: header
      items:
