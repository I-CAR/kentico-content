    heading: Recognized for Our Culture
    paragraphs:
      - >-
        I-CAR’s culture is consistently recognized by leading workplace organizations. We’re honored to be named one of
        the Top 100 Inspiring Workplaces in North America for 2025, ranking #16 overall and #4 among mid-sized
        companies.
      - >-
        We’ve also been recognized as a Top Workplace and a Great Place to Work&reg;, with additional honors for remote
        work, compensation and benefits, leadership, purpose and values, and work-life flexibility. These recognitions
        reflect what our team members experience every day, feeling supported, valued, and connected to meaningful work.
