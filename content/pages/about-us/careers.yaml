slug: careers
title: About Us - Careers
sections:
  - id: hero
    type: hero
    heading: Drive Your Career Forward
    variant: banner
    label: Careers at I-CAR
    sublabel: In a culture fueled by collaboration and growth.
    paragraphs:
      - >-
        No matter where you are in your career, from an intern or recent graduate to a seasoned professional or
        experienced collision repair expert, working at I-CAR is a rewarding step forward. We offer a primarily remote,
        flexible workplace that supports work-life balance while enabling meaningful collaboration across our teams.
      - >-
        With an award-winning culture and a strong commitment to employee growth and development, I-CAR is a place where
        people are supported, valued, and empowered to do their best work. Put your talents to use making a lasting
        impact across an industry that truly matters.
    buttons:
      location: header
      items:
        - label: Explore Open Roles
          href: https://careers.i-car.com/search
    image:
      alt: Two coworkers walking and talking in an office
      urls:
        desktop:
          800w: /getmedia/fc965d46-7a60-4bb1-9342-2f48ca6f9b5f/Hero_800w-D.webp
