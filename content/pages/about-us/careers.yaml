  - id: team-quotes
    type: quoteGrid
    heading: Hear From Our Team
    quotes:
      - quote: >-
          The culture at I-CAR is respectful, inclusive, and truly supportive. This organization values each person’s
          contributions and unique perspectives, and I feel empowered to bring my authentic self to work every day.
          I-CAR’s commitment to developing and supporting its team helps people grow into the best versions of
          themselves while making a meaningful impact on the collision industry. It’s a culture that empowers you to
          grow, contribute, and be part of something that truly matters.
        name: Olivia Peterson
        title: Instructor Trainee, Specialty Training
        image:
          alt: Olivia Peterson
          urls:
            desktop:
              70w: /getmedia/00d14c80-69a1-471a-9e99-3ef183aa8104/Peterson_70w.webp
              140w: /getmedia/9e723cea-1da1-4f52-b362-bb39716bf205/Peterson_140w.webp
          height:
            desktop: 70
      - quote: >-
          Returning to I-CAR in 2026 as a full-time instructor, I quickly recognized its strong commitment to continuous
          learning and skill development. In my role, I help reinforce the importance of safe, high-quality repairs
          while supporting learner growth. What stands out most is the culture, one where employees continuously
          develop, collaborate, and contribute to meaningful work that has a real impact on the industry.
        name: John Spoto
        title: Full-Time Instructor
        image:
          alt: John Spoto
          urls:
            desktop:
              70w: /getmedia/fd8e4e27-9be8-499c-8139-564f204e3bff/Spoto_70w.webp
              140w: /getmedia/7d501424-5a72-4876-a5dd-b2320044a2e0/Spoto_140w.webp
          height:
            desktop: 70
      - quote: >-
          I-CAR is a place where hard work, sincerity, and empathy are recognized and appreciated every day. The culture
          fosters a genuine sense of belonging, where people support each other’s success. I’m proud to be part of a
          team where leaders truly champion our growth, making every contribution feel seen, valued, and impactful. It’s
          the kind of environment where you can grow, contribute, and feel truly connected to the work you do.
        name: Vathsala Devarajan
        title: Manager, IT Application Agile
        image:
          alt: Vathsala Devarajan
          urls:
            desktop:
              70w: /getmedia/3cf194bf-730e-4e22-a613-a9526c38479e/Devarajan_70w.webp
              140w: /getmedia/af179248-2f6b-4406-b7a6-3e717883f14a/Devarajan_140w.webp
          height:
            desktop: 70
      - quote: >-
          Since joining I-CAR, I quickly realized it’s more than just an organization, it’s a true community. The
          collaboration, passion for the industry, and focus on safe, complete, high-quality repairs immediately stood
          out to me. At its core, I-CAR is committed to helping keep people safe on the road, which makes the work we do
          even more meaningful. It’s incredibly rewarding to be part of an organization that not only supports its
          people but also helps elevate standards across the entire collision industry.
        name: Carlos Garcia
        title: Principal, Business Development Northeast
        image:
          alt: Carlos Garcia
          urls:
            desktop:
              70w: /getmedia/d12175b9-78b5-4e2f-9ab4-1bbafddbd27d/Garcia_70w.webp
              140w: /getmedia/10f45862-86b6-4597-88d3-165f76af4588/Garcia_140w.webp
          height:
            desktop: 70
    buttons:
      location: footer
      items:
        - label: Learn More About Our Culture
          href: /about-us/culture
          variant: outline
