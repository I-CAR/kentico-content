  - id: employee-benefits-quotes
    type: quoteGrid
    heading: What Our Employees Say About Our Benefits
    backgroundColor: light
    quotes:
      - quote: >-
          Since its introduction, the I-CARe Wellbeing Program has continued to grow in meaningful ways. The flexibility
          of the cash incentive has made a real difference for me, it allowed my family to invest in home gym equipment
          that fits perfectly with our busy life of kids and sports. Having the ability to prioritize both physical
          health and quality time at home has been invaluable. It’s a benefit that truly supports overall wellbeing in a
          practical and personalized way.
        name: Tony Guzman
        title: Supervisor, Instructional Design
        image:
          alt: Tony Guzman
          urls:
            desktop:
              70w: /getmedia/22e353e7-4958-4575-a70b-dc2c1ed067b1/Guzman_70w.webp
              140w: /getmedia/3c22cf2c-49db-439a-95af-e11edf47634a/Guzman_140w.webp
          height:
            desktop: 70
      - quote: >-
          I-CAR has been deeply committed to my professional development, providing meaningful leadership opportunities
          that have helped advance my career. As I’ve progressed and started a family, the support and flexibility I’ve
          received in balancing work and home life have made a lasting impact. I-CAR has a unique culture that truly
          enables growth, both professionally and personally, in a way that feels sustainable and supported.
        name: Johnathan Pettinato
        title: Director, People & Culture
        image:
          alt: Johnathan Pettinato
          urls:
            desktop:
              70w: /getmedia/db8cf7af-22a1-4189-b430-5520df834ca3/Pettinato_70w.webp
              140w: /getmedia/730f5589-f926-4669-b443-d8f78cde2060/Pettinato_140w.webp
          height:
            desktop: 70
      - quote: >-
          Having comprehensive medical benefits meant the hardest part of my experience was simply hearing the
          diagnosis. Meritian Health made everything after that feel manageable, guiding me through each step with
          clarity and compassion so I could focus on healing instead of navigating complexity. The support I received
