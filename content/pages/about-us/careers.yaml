        paragraphs:
          - >-
            Every role at I-CAR contributes to work that helps save lives. By advancing safe, high-quality vehicle
            repairs, our teams make a real impact across the industry and in every community we serve.
        image:
          alt: Woman securing her child in a carseat
          urls:
            desktop:
              400w: /getmedia/9cc9959f-2e1e-4896-8b66-3a04b54f7116/Drive-Meaningful-Impact_400w-D.webp
