  - id: nomination-overview
    type: stickyCards
    backgroundColor: white
    heading: Platinum Individual Nomination Form for 2025 Performance Year
    buttons:
      items:
        - label: View Previous I-CAR Award Recipients
          href: https://info.i-car.com/about-us/awards
          variant: outline
    cards:
      - heading: Purpose
        body:
          - This award recognizes individuals who demonstrate a commitment to
            continuous learning, professional growth, and advancing industry
            standards through ongoing training and development.
      - heading: Eligibility
        titleClassName: ic-h4
        content:
          - "This award will be bestowed upon a select individual that meets the
            following requirements:"
        listItems:
          - Holds a long term (defined as at least five consecutive years) I-CAR
            Platinum Individual designation
          - Trains beyond the minimum requirement to maintain the designation
          - Available for a member of any industry segment that meets criteria
        footer: Please note all current I-CAR employees are not eligible to earn this
          award. This includes I-CAR full-time and part-time instructors.
      - heading: Nominating Procedure
        body:
          - Complete this form and submit it prior to July 31, 2026. For
            questions, email i&#8209;car.events.dept@i-car.com.
      - heading: Presentation of Award
        body:
          - The award will be presented during 2026 SEMA Week in Las Vegas, on
            Tuesday, November 3, at the Collision Industry Red Carpet Awards.
  - id: form-copy
    type: html
    html: >-
      <h2 class="ic-section-title">Contact Information</h2>

      <p>If nominating a Platinum Individual, complete both your contact
      information as the submitter, and the nominee's below. If self-nomination,
      check the box and only complete the following nominee contact
      information.</p>
