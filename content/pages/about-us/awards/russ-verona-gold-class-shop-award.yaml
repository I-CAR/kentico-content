  - id: nomination-overview
    type: stickyCards
    backgroundColor: white
    heading: Collision Repair Shop Nomination Form for 2025 Performance Year
    buttons:
      items:
        - label: View Previous I-CAR Award Recipients
          href: https://info.i-car.com/about-us/awards
          variant: outline
    cards:
      - heading: Purpose
        body:
          - >-
            Given annually, this award recognizes Gold Class shops that demonstrate a commitment to training, repair
            quality, and safety in alignment with industry standards.
      - heading: Eligibility
        titleClassName: ic-h4
        contentHtml:
          - >-
            <p>This award will be bestowed upon a select collision repair shop that meets the
            following&nbsp;requirements:</p>
        listItems:
          - Holds a long term (defined as at least five consecutive years) I-CAR Gold Class designation
          - >-
            Actively promotes the Gold Class designation, training, and a positive image of the collision industry
            (locally or on a broader scale)
        footer: >-
          Please note all current I-CAR employees are not eligible to earn this award. This includes I-CAR full-time
          and part-time instructors.
      - heading: Nominating Procedure
        bodyHtml:
          - >-
            Complete this form and submit it prior to <time datetime="2026-07-31">July 31,&nbsp;2026</time>. For
            questions, email&nbsp;<a href="mailto:i-car.events.dept@i-car.com">i&#8209;car.events.dept@i-car.com</a>.
      - heading: Presentation of Award
        bodyHtml:
          - >-
            The award will be presented during 2026 SEMA Week in Las Vegas, on <time datetime="2026-11-03">Tuesday,
            November&nbsp;3</time>, at the Collision Industry Red Carpet&nbsp;Awards.
