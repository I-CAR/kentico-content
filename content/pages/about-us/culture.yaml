  - id: ceo
    type: quote
    heading: A Message From Our CEO
    backgroundColor: light
    quoteLayout: side-by-side
    centerIntro: true
    introTextClassName: mb-3 pb-3 text-center
    paragraphs:
      - Hear from our CEO on how we're building a culture that supports our people and helps advance the industry.
    embed:
      html: |-
        <div style="position: relative; display: block; max-width: 480px;">
        <div style="padding-top: 56.25%;">
        <iframe
          src="https://players.brightcove.net/1862663934001/default_default/index.html?videoId=6400550602112"
          allowfullscreen=""
          allow="encrypted-media"
          style="position: absolute; top: 0px; right: 0px; bottom: 0px; left: 0px; width: 100%; height: 100%;">
        </iframe>
        </div>
        </div>
    quoteHtml:
      - <strong>At I&#8209;CAR, our people are at the center of everything we&nbsp;do.</strong>
      - >-
        We're intentional about building a culture where individuals feel supported, challenged, and empowered to
        grow-because when our people thrive, our impact grows with&nbsp;them.
      - >-
        We invest in learning, development, and collaboration so our teams can build meaningful careers while
        contributing to something bigger than themselves. That commitment doesn't stop within our walls &ndash; it
        extends to the role we play in strengthening and advancing the collision repair&nbsp;industry.
      - >-
        <strong>I'm proud of the culture we're building-one that supports our people, elevates our industry, and makes a
        difference every&nbsp;day.</strong>
    cite:
      name: Kyle Thompson
      title: I-CAR CEO & President
      titleHtml: I&#8209;CAR CEO &amp;&nbsp;President
      image:
        alt: Kyle Thompson
        width: 100
        urls:
          desktop:
            100w: /getmedia/50762219-1963-4704-b29d-0f421f61fd78/Kyle-Thompson_100w.webp
            200w: /getmedia/e490aa05-18b9-4a57-9fea-904cc227b7ae/Kyle-Thompson_200w.webp
        height: 100
    __template:
      id: ceo
      type: quote
      variant: default
      signature: 723e41d28080f7771610b6aa888a87fba4f37e71
  - id: purpose
    type: statementList
    heading: Our Purpose and Impact
    textAlignment: center
    paragraphs:
      - >-
        Our purpose guides the work we do every day—and every role contributes to advancing safety, quality, and
        performance across the industry.
    statements:
      - heading: I-CAR Vision
        body: >-
          That every person in the collision repair industry has the information, knowledge and skills required to
          perform complete, safe and quality repairs for the ultimate benefit of the consumer.
      - heading: I-CAR Mission
        body: >-
          To deliver increasingly accessible, on-demand and relevant education, knowledge, services and solutions for
          collision repair facilities and the related industry value chain.
    __template:
      id: purpose
      type: statementList
      variant: default
      signature: dc163f57951b6fa81717d03f5e10545fa1f08cd2
  - id: values
    type: mediaFeatureList
    heading: Our Core Beliefs and Values
    textAlignment: center
    paragraphs:
      - Our core beliefs and values guide how we work together and shape the impact we make every day.
    spacing:
      paddingTop: none-lg
    cards:
      - heading: Collaboration
        lead: >-
          I-CAR is dedicated to fostering a team environment while understanding and acting on the needs of the
          Inter-Industry.
        paragraphs:
          - >-
            This commitment is demonstrated by empowering and appreciating engagement and teamwork, listening to and
            being guided by the Voice-of-the-Industry, serving with integrity as a neutral forum for all parties,
            encouraging participation and involvement at all levels, supporting a respectful culture, and working
            cooperatively both internally and externally.
        image:
          alt: Two employees collaborating over a computer in an office
          urls:
            desktop:
              400w: /getmedia/364047ae-6d10-415c-94d1-4c2255ee1603/Collaboration_400w-D.webp
              800w: /getmedia/02d533c1-5be8-4707-9c1b-3d209ca01c0f/Collaboration_800w-D.webp
              1600w: /getmedia/12645d6b-93cf-4c32-b9cf-0c897214ac7f/Collaboration_1600w-D.webp
            mobile:
              400w: /getmedia/bf510604-a558-48a5-a0be-1c4920d99cd0/Collaboration_400w-M.webp
              800w: /getmedia/bef9f72e-d59c-4f49-b293-b889441c673a/Collaboration_800w-M.webp
              1600w: /getmedia/484507bc-db6c-48db-803c-6502ae58f58a/Collaboration_1600w-M.webp
          height: 220
      - heading: Relevance
        lead: >-
          I-CAR is dedicated to continually enhancing the value delivered to the Inter-Industry in curriculum, courses
          and services.
        paragraphs:
          - >-
            This commitment is demonstrated by listening and acting appropriately while ensuring I-CAR's sustainability,
            setting priorities responsive to customer needs and industry innovations, and being an industry-minded
            enterprise focused on advancing the knowledge of the industry, its companies, the individual who serve in it
            and those who are served by it.
        image:
          alt: A digital screen on a car's interior dashboard
          urls:
            desktop:
              400w: /getmedia/0ff5d35c-72aa-4e2d-92e1-840d9e809605/Relevance_400w-D.webp
              800w: /getmedia/49342e57-e5ea-4382-a620-a3609cf50921/Relevance_800w-D.webp
              1600w: /getmedia/2c244598-c897-4fc4-9cbb-e56f8adb4d7b/Relevance_1600w-D.webp
            mobile:
              400w: /getmedia/84cff5b9-5185-4c54-9b07-1955c07e58a4/Relevance_400w-M.webp
              800w: /getmedia/6851ef65-8807-4aab-8452-68476b3c7573/Relevance_800w-M.webp
              1600w: /getmedia/7de6f55b-d127-45b1-b421-b1177f90eec6/Relevance_1600w-M.webp
          height: 220
      - heading: Expertise
        lead: I-CAR is dedicated to being a respected resource for the Inter-Industry.
        paragraphs:
          - >-
            This commitment is demonstrated by maintaining leadership and current knowledge in education, training,
            vehicle and repair technologies, and industry best practices; providing expert insight to the
            Inter-Industry; staying well informed about current and anticipated conditions; and retaining skilled
            professionals recognized as subject matter experts in their fields.
        image:
          alt: An instructor teaching a student with hands-on materials
          urls:
            desktop:
              400w: /getmedia/6a36f6b8-df33-49ed-a82a-61f6f081acff/Expertise_400w-D.webp
              800w: /getmedia/fc9500be-133a-410d-8f14-b7e9acafa754/Expertise_800w-D.webp
              1600w: /getmedia/c53cf410-5683-4982-961d-5ee61c0c7915/Expertise_1600w-D.webp
            mobile:
              400w: /getmedia/8a3197ee-ce2d-4daa-a667-bd0a69feb170/Expertise_400w-M.webp
              800w: /getmedia/d549f6b1-96df-4963-bf0a-38e87f53787c/Expertise_800w-M.webp
              1600w: /getmedia/e17c1dd7-c6b8-45be-962c-7dadd5365085/Expertise_1600w-M.webp
          height: 220
      - heading: Excellence
        lead: >-
          I-CAR is dedicated to being the best we can possibly be for the ultimate benefit of the industry we serve, as
          well as our volunteers, instructors and staff.
        paragraphs:
          - >-
            This commitment is demonstrated by being accountable and holding each other accountable in a team-spirited
            manner, continually striving to be extraordinary in service and operation, exhibiting a sense of urgency and
            a bias for action, having a strong work ethic and being disciplined about how we approach our work, and
            always possessing a conscience about being the best we can possibly be.
        image:
          alt: A woman reviewing reports on a computer screen in an office
          urls:
            desktop:
              400w: /getmedia/f3ad8945-6eed-4f3b-80a3-15527558cd0a/Excellence_400w-D.webp
              800w: /getmedia/2ef9b659-cde4-4b91-81ff-0d0644b368c3/Excellence_800w-D.webp
              1600w: /getmedia/bb924c64-743b-42d8-b77a-7b442fb41172/Excellence_1600w-D.webp
            mobile:
              400w: /getmedia/3be876a7-ba26-484a-85e1-ada72e398e17/Excellence_400w-M.webp
              800w: /getmedia/a342a9c3-843f-4fca-bf48-3e7dbd678bcf/Excellence_800w-M.webp
              1600w: /getmedia/1ac298e5-0877-4698-a1d3-b9b2fd763d02/Excellence_1600w-M.webp
          height: 220
      - heading: Integrity
        lead: I-CAR is dedicated to being trustworthy.
        paragraphs:
          - >-
            This commitment is demonstrated by delivering on promises; being ethical, honest, fair, and sincere in
            communications and behavior; and being transparent in our decision-making.
        image:
          alt: A collision repair shop employee inspecting a wheel on a lifted car
          urls:
            desktop:
              400w: /getmedia/423d97fc-ddce-496c-b4ac-49e4540bf65e/Integrity_400w-D.webp
              800w: /getmedia/52356168-e22c-4530-abe0-fa5f11c383d4/Integrity_800w-D.webp
              1600w: /getmedia/ed374f20-59fb-4968-8b5b-e2bb1207850b/Integrity_1600w-D.webp
            mobile:
              400w: /getmedia/1ecef2e7-e50c-46a0-8551-4582c3a290aa/Integrity_400w-M.webp
              800w: /getmedia/c5434c7c-70c9-4e3a-80a0-7ed2c942b3f7/Integrity_800w-M.webp
              1600w: /getmedia/c526b56c-cf29-4439-8232-47d6999b80d5/Integrity_1600w-M.webp
          height: 220
