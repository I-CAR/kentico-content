slug: culture
title: About Us - Culture
sections:
  - id: hero
    type: hero
    heading: A Culture Built on Purpose – Powered by People
    headingTag: h1
    variant: split
    imageStyle: rounded
    spacing:
      paddingTop: none
    paragraphs:
      - Our culture is defined by how we work together, support one another, and show up every day.
      - At I-CAR, collaboration and shared purpose drive everything we do-helping us grow and move the industry forward.
    image:
      alt: Coworkers gathered around a laptop during a meeting
      loading: lazy
      output:
        imgWidth: 800
        srcWidth: 400
      urls:
