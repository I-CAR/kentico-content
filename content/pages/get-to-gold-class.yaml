  - id: faq
    type: accordion
    heading: FAQ
    paragraphs: []
    items:
      - title: How do I know if Gold Class is right for my shop?
        paragraphs:
          - >-
            Gold Class is designed for collision repair shops of all sizes that are committed to excellence, continuous
            improvement, and staying current with evolving vehicle technology.
      - title: Can smaller collision repair shops earn Gold Class recognition?
        paragraphs:
          - >-
            Yes. Gold Class is available to shops of all sizes. The program focuses on your commitment to training,
            quality standards, and continuous improvement rather than shop size.
      - title: How long does it take to achieve Gold Class?
        paragraphs:
          - >-
            The timeline varies based on your shop's starting point and training needs. I-CAR specialists will work with
            you to create a custom plan that fits your goals and timeline.
      - title: Does Gold Class help meet OEM or insurance network requirements?
        paragraphs:
          - >-
            Yes. Gold Class training and certification help shops meet many OEM and insurance network requirements for
            quality and safety standards.
      - title: Can I speak with an advisor before getting started?
        paragraphs:
          - >-
            Absolutely. I-CAR specialists are available to discuss your shop's needs and create a personalized Gold
            Class plan. Submit the form above to connect with an advisor.
