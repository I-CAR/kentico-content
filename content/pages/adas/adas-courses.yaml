        technicians build critical ADAS skills while staying industry-ready.
  - id: platinum
    type: textMedia
    title: Platinum Path
    body:
      - ADAS is one of the fastest-growing specialties in collision repair. As
        vehicles become more complex, shops need experts who can restore
        advanced safety systems with precision. Whether you're building your
        career or future-proofing your business, ADAS expertise ensures safer,
        OEM-compliant repairs and sets you apart in a rapidly evolving industry.
    buttons:
