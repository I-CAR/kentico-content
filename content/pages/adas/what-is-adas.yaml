    title: What is ADAS?
    body:
      - >-
        Advanced Driver Assistance Systems (ADAS) are now standard in modern vehicles and directly impact how repairs
        are performed. From sensor alignment to windshield calibration, understanding ADAS is essential for restoring
        safety systems after a&nbsp;collision.
