  - id: faq
    type: accordion
    title: Common ADAS Questions
    backgroundColor: light
    accordionId: faqAccordion
    items:
      - title: What does recalibration mean in a repair shop?
        body:
          - >-
            Recalibration means resetting ADAS sensors after repairs. This is critical after replacing windshields,
            bumpers, or suspension components, or after any structural work that could affect sensor alignment.
      - title: What is ADAS windshield calibration?
        body:
          - >-
            When a windshield is replaced, the forward-facing camera mounted behind it must be recalibrated. This
            ensures systems like lane departure warning and adaptive cruise control function properly.
      - title: What does calibration mean on a car after a collision?
        body:
          - >-
            Calibration means ensuring all ADAS sensors are properly aligned and communicating with the vehicle’s
            control systems. It’s a key step in post-repair safety validation.
      - title: Where are ADAS sensors located on a vehicle?
        listIntro: "ADAS sensors may be found:"
        listItems:
          - Behind the windshield (camera)
          - In the front and rear bumpers (radar and sonar)
          - In side mirrors (blind spot detection)
          - Around the vehicle perimeter (ultrasonic sensors)
        closingText: Technicians must inspect these areas after any impact.
      - title: Which ADAS features are most affected by collision damage?
        listItems:
          - Forward collision warning
          - Lane keeping assist
          - Blind spot monitoring
          - Parking assist
          - Adaptive cruise control
        closingText: These systems rely on precise sensor placement and may require recalibration or replacement.
      - title: What types of ADAS technologies help prevent crashes?
        listIntro: "Technologies include:"
        listItems:
          - Automatic emergency braking
          - Lane departure warning
          - Pedestrian detection
          - Cross-traffic alert
          - Driver attention monitoring
        closingText: Collision repair shops must ensure these systems are restored to OEM specs.
      - title: What is the expected benefit of ADAS in collision repair?
        body:
          - >-
            ADAS helps prevent future accidents. Proper calibration after repairs ensures the vehicle’s safety systems
            are fully functional, protecting both the driver and others on the road.
      - title: What are the six levels of driver assistance technology?
        listIntro: "Technicians should be aware of these SAE levels:"
        listItems:
          - "Level 0: No automation"
          - "Level 1–2: Driver assistance (ADAS)"
          - "Level 3–5: Increasing levels of autonomy"
        closingText: >-
          Most collision repair work today involves Level 1–2 systems, which require technician intervention for
          calibration.
      - title: What does it mean to calibrate a car in a body shop?
        body:
          - >-
            It means using OEM-approved tools and procedures to realign ADAS sensors after repairs. Calibration is
            essential for restoring vehicle safety.
      - title: Which alignment procedure may involve self-calibration?
        body:
          - >-
            Dynamic calibration often involves self-calibration, where the vehicle adjusts its sensors during a test
            drive under specific conditions.
      - title: What is car calibration after a crash?
        body:
          - >-
            Car calibration ensures that all safety systems are functioning as intended. It’s a critical final step in
            the repair process, especially for vehicles with ADAS.
      - title: How do safety devices inside a car help keep customers safe after repairs?
        body:
          - >-
            Safety devices like airbags, seatbelts, and ADAS systems must be inspected and tested after a collision.
            Proper repair and calibration ensure they’ll perform correctly in future incidents.
