  # ─── Section 2: An Exceptional Repair Experience ─────────────────────────────
  # Source: lines 42–102. section-resources bg-light.
  # Source uses div.checkmark items (3), NOT a typed card type.
  # STOP CONDITION: Senior — checkmark visual component has no typed equivalent.
  # Mapped as cards type (3 cards, heading + paragraph, NO href).
  # REDESIGN DIFFERENCE: checkmark icon styling dropped; visual appearance differs.
  - id: repair-experience
    type: cards
    backgroundColor: light
    heading: "An Exceptional Repair Experience"
    body: "Your collision repair network represents your brand after a collision. Leverage I-CAR&rsquo;s technical expertise, industry connections, and leadership to help them deliver exceptional repair experiences for your&nbsp;customers."
    cards:
      - heading: "Vehicle and Technology Specific Training"
        paragraphs:
          - "We can help develop customized training and delivery for your network around a specific model, repair process, or&nbsp;technology."
      - heading: "Technical Resources"
        paragraphs:
          - "Our industry-leading subject matter experts develop content and resources in an online hub to support the ongoing needs of collision&nbsp;repairers."
      - heading: "Network Training Documentation"
        paragraphs:
          - "Let us help you track and report on the training status of your network to help facilitate network business decisions to best&nbsp;serve."

