  # ─── Section 2: Training and Technical Resources ─────────────────────────────
  # Source: lines 42–112. section-resources bg-light. 4 text cards (no images).
  # CRM source uses class="text-card" on card divs; typed renders text cards with no image.
  # Talent Attraction has target="_blank".
  - id: resources
    type: cards
    backgroundColor: light
    heading: "Training and Technical Resources"
    body: "Comprehensive education and technical resources are available to drive your shop performance and your team&rsquo;s professional development."
    cards:
      - heading: "Gold Class Recognition"
        paragraphs:
          - "Set your shop apart and achieve the highest role-relevant training in the industry."
        href: "https://info.i-car.com/gold-class/gold-class-collision-repair"
        ctaLabel: "Discover Gold Class"
      - heading: "Academy for Shops"
        paragraphs:
          - "Develop entry-level technicians into productive members of your team."
        href: "https://www.i-car.com/academyshops"
        ctaLabel: "Learn About Academy"
      - heading: "Subscription"
        paragraphs:
          - "Take advantage of unlimited live, online, and virtual training for everyone in the shop."
        href: "https://www.i-car.com/subscription"
        ctaLabel: "Explore Options"
      - heading: "Talent Attraction"
        paragraphs:
          - "Dedicated to informing and inspiring the next&nbsp;generation."
        href: "https://www.collisioncareers.com/s/"
        target: "_blank"
        ctaLabel: "Visit Collision Careers"

