  # ─── Section 3: Together, We All Win ─────────────────────────────────────────
  # Source: lines 150–176. section. textMedia left.
  # copy: col-md col-lg-6 pl-md-5 ml-xl-5 order-2 ... order-2 order-md-1; media: col-auto ... order-1 order-md-2
  # At mobile: media order-1 (above). At desktop: media order-md-2 (right?), copy order-md-1 (left)?
  # Source copy: "order-2 order-md-1" → at desktop copy is order-md-1 (first = LEFT).
  # Source media: "order-1 order-md-2" → at desktop media is order-md-2 (second = RIGHT).
  # So at desktop: copy LEFT, media RIGHT → desktopMediaPosition: right?
  # But the sustaining-partners logo is the image, and the copy "Together We All Win" + text is left.
  # This is different from insurance S3 (media LEFT, copy RIGHT).
  # desktopMediaPosition: right (media on right at desktop), mobileMediaOrder: above
  # Gap: copy has pl-md-5 → for desktopMediaPosition:right, desktopGapTarget:copy → pr-md-5.
  # DEVIATION: source pl-md-5 (left side of copy) vs typed pr-md-5 (right side of copy).
  # imageRounded: false; imageFrame: none (SVG logo).
  - id: together
    type: textMedia
    imageRounded: false
    heading: "Together, We All Win"
    sublabel: "Explore the benefits the I-CAR Sustaining Partner Program provides, including access to information, course content and marketing&nbsp;opportunities."
    buttons:
      - label: "See Sustaining Partners"
        href: "https://info.i-car.com/sustaining-partners"
        variant: outline
    image:
      alt: "sustaining partners logo"
      width: 220
      height: 104
      src: "/getmedia/787c1c7c-72c0-4d88-8564-bddf01a231cb/logo_sustaining-partners.svg"
    layout:
      desktopMediaPosition: right
      mobileMediaOrder: above
      imageFrame: none

