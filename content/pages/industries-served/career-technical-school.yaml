          height: 374
          sizes: "(max-width: 400px) 364px, 728px"
          srcset: "/getmedia/002a920d-9e09-4a08-a77b-f7e7d842df39/Partnership_364w.webp 364w, /getmedia/1c10f2eb-a42b-4300-823f-bad3afd17c79/Partnership_728w.webp 728w, /getmedia/7f4139b8-484a-49ef-a6f5-c0f1ef2ed412/Partnership_1456w.webp 1456w"
