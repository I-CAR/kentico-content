  # ─── Section 5: PDP-EE ───────────────────────────────────────────────────────
  # Source: lines 190–225. section bg-light. textMedia left.
  # copy: col-12 col-md col-xl-7 pl-md-4 ... order-2; media: col-auto order-1 pr-md-4
  # desktopMediaPosition: left (media order-1 at all sizes → left)
  # mobileMediaOrder: above (media order-1 at mobile)
  # desktopGapTarget: copy, desktopGapBreakpoint: md → pl-md-5 (source: pl-md-4; approx.)
  # DEVIATION: source uses pl-md-4 (1.5rem); typed produces pl-md-5 (3rem). Minor gap diff.
  # imageRounded: false (source SVG logo has no img class)
  # Two body paragraphs: one with regular text, one with mailto link.
  # Using paragraphs[] for multi-paragraph body. Senior: confirm paragraphs[] in textMedia.
  - id: pdp-ee
    type: textMedia
    backgroundColor: light
    imageRounded: false
    heading: "Professional Development Program - Education Edition (PDP&#8209;EE)"
    paragraphs:
      - "I&#8209;CAR PDP&#8209;EE program was developed to equip Career &amp; Technical Education schools and educators with collision repair curriculum for their students. As vehicle technology and repair processes advanced, our entry-level curriculum, has evolved to keep pace, ensuring technicians are equipped with the latest skills and knowledge. I&#8209;CAR Academy for schools will completely replace PDP&#8209;EE by&nbsp;2027."
      - "For detailed transition timelines and milestones, please e-mail&nbsp;<a href=\"mailto:academy.schools@i-car.com\">academy.schools@i-car.com</a>."
    buttons:
      - label: "View PDP&#8209;EE"
        href: "https://pdp-ee.i-car.com/Home/PDP-Education-Edition-(PDP-EE)"
        target: "_blank"
        variant: outline
    image:
      alt: "sustaining partners logo"
      width: 228
      height: 185
      src: "/getmedia/5830ee53-f519-4c26-8c36-14e430bac0b4/PDP_EE.svg"
    layout:
      desktopMediaPosition: left
      mobileMediaOrder: above
      desktopGapTarget: copy
      desktopGapBreakpoint: md
