  # ─── Section 2: Educational Programs and Resources ───────────────────────────
  # Source: lines 45–127. bg-light. 3 logo cards (iconCardGrid), cardsPerRow: 3.
  # Cards are logo-card with heading link + paragraph + SVG icon.
  # Collision Careers and CREF have target="_blank" in source → card.target: "_blank"
  - id: programs
    type: iconCardGrid
    backgroundColor: light
    heading: "Educational Programs and Resources"
    body: "Comprehensive Career and Technical School educational programming, plus school and student resources are available to maximize your learning&nbsp;experience."
    layout:
      cardsPerRow: 3
    cards:
      - heading: "I&#8209;CAR Academy"
        paragraphs:
          - "Teach Foundational Collision Repair"
        href: "https://academy.i-car.com/schools/s/"
        iconSrc: "/getmedia/575d5507-8e1b-4280-b1d8-bc868489dc0f/I-CAR_Academy.svg"
        iconAlt: "I-CAR Academy"
        iconWidth: 200
        iconHeight: 114
      - heading: "Collision Careers"
        paragraphs:
          - "Recruit new students"
        href: "https://www.collisioncareers.com/s/"
        target: "_blank"
        iconSrc: "/getmedia/3dcf15bf-b9f6-4157-9261-30be8129f9fa/CollisionCareers.svg"
