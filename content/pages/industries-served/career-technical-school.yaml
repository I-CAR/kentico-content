    type: textMedia
    heading: "A Longstanding Partnership"
    sublabel: "I&#8209;CAR has partnered with Collision Repair Education Foundation and Career and Technical schools of all shapes and sizes (high schools, colleges and technical schools) to help provide training and education to new recruits and students entering the collision repair&nbsp;industry."
