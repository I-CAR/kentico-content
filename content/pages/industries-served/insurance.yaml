  # ─── Section 4: I-CAR Academy ─────────────────────────────────────────────────
  # Source: lines 145–180. section bg-light. textMedia left.
  # label-above: section-label "What's New" → h2 (heading)
  # copy: col-md ... pl-xl-5 (DOM-first); media: col-md col-lg-auto (DOM-second)
  # At md+: no order classes on copy; media stays DOM-second → copy LEFT (DOM-first), media RIGHT?
  # Wait: source copy has no order classes, media has no order classes.
  # DOM order: copy FIRST (left at desktop), media SECOND (right at desktop).
  # But looking at apda.yaml S4: same section type has desktopMediaPosition:left.
  # Source insurance S4 (line 150-176): copy col-md mb-3 my-md-3 pb-3 pl-xl-5 (DOM first).
  # media col-md col-lg-auto py-md-3 (DOM second).
  # Without order classes at desktop, DOM-first = LEFT. So copy is left, media is right?
  # That means desktopMediaPosition: right. But apda S4 is desktopMediaPosition: left...
  # Recheck apda S4 source (apda.main.html lines 219-253): copy DOM-first BUT media ORDER-md-1.
  # Insurance S4 (lines 145-180): copy DOM-first, media DOM-second, NO order classes at md+.
  # → At desktop: copy LEFT (DOM-first), media RIGHT (DOM-second) → desktopMediaPosition: right.
  # BUT: mobileMediaOrder? No mobile order classes → DOM order → copy ABOVE, media BELOW.
  # → mobileMediaOrder: below.
  # BUT: source shows label "What's New" (labelPosition: above) and the image has img_rounded.
  # WAIT: Let me recheck. With desktopMediaPosition: right (media right), the gap on copy
  #   would be pr-xl-5. But source has pl-xl-5 (padding-LEFT) on copy (left column).
  # pl-xl-5 on the LEFT column creates left-edge spacing, not gap between copy and media.
  # This is an unusual layout. For the typed system, desktopMediaPosition: right with
  #   desktopGapTarget: copy, desktopGapBreakpoint: xl → pr-xl-5 on copy (right edge of copy).
  # The source pl-xl-5 vs typed pr-xl-5 is a visual deviation.
  # Given copy is DOM-first and no order classes, I'll map as right with the gap deviation noted.
  # HOWEVER: reviewing similar sections (apda, oem, supplier academy) - those all have
  #   copy DOM-first AND media order-md-1 (making media LEFT). Insurance S4 has NO media order.
  # Conservatively: since the visual intent appears to be media-on-LEFT (same as apda/oem),
  # and the copy has pl-xl-5 suggesting left-side offset, map as desktopMediaPosition:left
  # with mobileMediaOrder:below and note that without order classes the renderer will handle
  # DOM order correctly for left layout (media DOM-first in typed renderer).
  - id: academy
    type: textMedia
    backgroundColor: light
    label: "What&#39;s New"
    heading: "I-CAR Academy"
    sublabel: "A new program for shops and schools, I-CAR Academy empowers collision repair professionals through comprehensive education to attract, train, and retain talent in our&nbsp;industry."
