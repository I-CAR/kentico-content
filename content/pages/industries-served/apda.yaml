  # ─── Section 2: Education and Technical Information ───────────────────────────
  # Source: lines 82–151. section-resources bg-light. 4 linked cards.
  # Source heading link is a stretched-link in a <p> AFTER card-body; typed renderer
  # makes the h3 heading the stretched-link and renders ctaLabel as aria-hidden cta.
  # RTS and Collision Careers have target="_blank" in source → card.target: "_blank"
  - id: education
    type: cards
    backgroundColor: light
    heading: "Education and Technical Information"
    body: "Comprehensive curriculum and insights to advance your career goals and keep up with technology that impacts the assessment for a safe&nbsp;repair."
    cards:
      - heading: "Continued Learning"
        paragraphs:
          - "Industry-recognized education to keep up with collision repair&nbsp;standards."
        href: "https://www.i-car.com/browse"
        ctaLabel: "Browse Catalog"
      - heading: "Platinum Recognition"
        paragraphs:
          - "Join the top peers in your field who earned this industry-renowned designation."
        href: "https://info.i-car.com/platinum/platinum-insurance"
        ctaLabel: "Become Platinum"
      - heading: "Repairability Technical Support (RTS)"
        paragraphs:
          - "Stay current on the latest repair methods, information, and&nbsp;procedures."
        href: "https://rts.i-car.com/"
        target: "_blank"
        ctaLabel: "Visit RTS"
      - heading: "Talent Attraction"
        paragraphs:
          - "Dedicated to informing and inspiring the next&nbsp;generation."
        href: "https://www.collisioncareers.com/s/"
        target: "_blank"
        ctaLabel: "View Collision Careers"

  # ─── Section 3: Emerging Technologies ────────────────────────────────────────
  # Source: lines 153–217. section pt-0 pb-1. 3 icon cards.
  # spacing.paddingTop: none maps pt-0 → pt-0 ✓
  # GAP: pb-1 (Bootstrap padding-bottom 0.25rem) has no typed equivalent;
  #      spacing.paddingBottom values are none/sm/lg — pb-1 is not one of them.
  # layout.cardsPerRow: 3 → col col-12 col-md-4 ✓ (source uses col-sm-6 col-xl-4)
  # GAP: source col-sm-6 vs typed col-md-4 — breakpoint differs at narrow widths.
  # iconSrc/iconAlt/iconWidth/iconHeight: source uses div.img-cnt > img;
  #   typed renders ic-card-icon ic-card-icon--image directly (no img-cnt wrapper).
  # source target="" on card links is a no-op → no target field needed.
  - id: emerging-tech
    type: iconCardGrid
    heading: "Emerging Technologies"
    body: "Keep up with advanced technology with courses and solutions for ADAS, EV and vehicle-specific repair&nbsp;information."
    spacing:
      paddingTop: none
    layout:
      cardsPerRow: 3
    cards:
      - heading: "Advanced Driver Assistance Systems"
        href: "https://info.i-car.com/adas"
        iconSrc: "/getmedia/f43b270a-9ea1-4793-9f0e-0be11cb3ce31/Emerging-Tech_ADAS-100w.svg"
        iconAlt: "Icon of long meeting table with chairs"
        iconWidth: 100
        iconHeight: 100
      - heading: "Electric Vehicles"
        href: "https://info.i-car.com/electric-vehicles"
        iconSrc: "/getmedia/bdb6f1f4-303e-4820-a593-252285e41826/Emerging-Tech_EV-100w.svg"
        iconAlt: "Icon of speaker at podium speaking to an audience"
        iconWidth: 100
        iconHeight: 100
      - heading: "Vehicle and Technology Specific"
        href: "https://my.i-car.com/s/learning-path-role/a3A1I000000hVdvUAE/vehicle-technology-specific-training"
        iconSrc: "/getmedia/81f09b77-f18d-48dd-a7f7-39448f648d7a/Emerging-Tech_VTST-100w.svg"
        iconAlt: "Icon of someone presenting pointing at a line graph show an upward trajectory"
        iconWidth: 100
        iconHeight: 100

  # ─── Section 4: I‑CAR Academy ─────────────────────────────────────────────────
  # Source: lines 219–253. section bg-light. textMedia left.
  # label-above: source .section-label uses What&#39;s New (straight apostrophe)
  # heading uses U+2011 non-breaking hyphen → &#8209; in YAML
  # desktopMediaPosition: left — media is order-md-1 (first at md+)
  # mobileMediaOrder: below — copy is DOM-first, no mobile order classes in source
  # desktopGapTarget: copy + desktopGapBreakpoint: xl → pl-xl-5 on copy ✓
  #   source: pl-xl-5 on copy column
  # imageFrame: none — source uses img.img_rounded (legacy); typed produces ic-image-rounded
  # GAP: source col-md (no number) + col-lg-auto on media; typed equal → col-md-6 col-md-6
  # GAP: source copy mb-3 my-md-3 pb-3 spacing not mapped by typed schema
  # Academy source image source: last srcset entry has no width descriptor (preserved as-is)
  - id: academy
    type: textMedia
    backgroundColor: light
    label: "What&#39;s New"
    heading: "I&#8209;CAR Academy"
    sublabel: "A new program for shops and schools, I&#8209;CAR Academy empowers collision repair professionals through comprehensive education to attract, train, and retain talent in our&nbsp;industry."
    buttons:
      - label: "Explore I-CAR Academy"
        href: "https://www.i-car.com/browse/academy"
        variant: outline
    image:
      sources:
        - maxWidth: 767.9
          width: 615
          height: 374
          sizes: "(max-width: 400px) 364px, 728px"
          srcset: "/getmedia/cd79ebd9-2ca4-407b-bf7e-774a0e61c1ed/academy_364w.webp 364w, /getmedia/aa498d7e-cd7e-46b9-a12b-24bf0f3e53e6/academy_728w.webp 728w, /getmedia/7ec20891-2091-41a8-9dd9-8e7483607091/academy_1456w.webp"
      alt: "tech in front of car"
      width: 615
      height: 400
      sizes: "615px"
      src: "/getmedia/aabbf9c5-c819-42db-bf94-a58e803fa01f/academy_615w.webp"
      srcset: "/getmedia/aabbf9c5-c819-42db-bf94-a58e803fa01f/academy_615w.webp 615w, /getmedia/dcfa6cae-f8e6-42b1-b9ff-e0e40de1c608/academy_1230w.webp 1230w"
    layout:
      desktopMediaPosition: left
      mobileMediaOrder: below
      labelPosition: above
      desktopGapTarget: copy
      desktopGapBreakpoint: xl
      imageFrame: none

  # ─── Section 5: Training Opportunities ───────────────────────────────────────
  # Source: lines 255–303. section (no modifier). 2 image cards.
  # Heading links are stretched-link on h3 in source → typed: h3 becomes stretched-link ✓
  # Images are single <img> (no picture sources); srcset passed through as-is.
  # programs_728w srcset has entry with no width descriptor (preserved as-is).
  - id: training
    type: cards
    heading: "Training Opportunities"
    body: "It&rsquo;s easier than ever to get the training that&rsquo;s right for your career and&nbsp;business."
    cards:
      - heading: "Network Programs"
        paragraphs:
          - "Discover the training required for shops to participate in various Insurance and OEM&nbsp;networks."
        href: "https://info.i-car.com/network-programs"
        image:
          alt: "insurance adjusters inspecting collision"
          width: 728
          height: 334
          sizes: "(max-width: 399.9px) 362px, (max-width: 767.9px) 728px, 486px"
          src: "/getmedia/6c64c980-cab3-4df3-a063-500df95cbbd1/programs_728w.webp"
          srcset: "/getmedia/b7cdf8b9-ea4b-427b-a901-f1d3c77f5bcd/programs_362w.webp 362w, /getmedia/35ad8b05-02a3-4a0a-b56d-6afcc3e08b68/programs_486w.webp 486w, /getmedia/6c64c980-cab3-4df3-a063-500df95cbbd1/programs_728w.webp, /getmedia/55e2bfec-7947-4c6f-92cf-cdc00e91f7b7/programs_972w.webp 972w, /getmedia/00b39cfc-5d99-4e60-a646-c4d063857bfe/programs_1456w.webp 1456w"
      - heading: "Industry Training Alliance"
        paragraphs:
          - "Get I&#8209;CAR credit for approved training you&rsquo;ve already completed."
        href: "https://www.i-car.com/industry-training-alliance"
        image:
          alt: "tech painting car"
          width: 728
          height: 334
          sizes: "(max-width: 399.9px) 362px, (max-width: 767.9px) 728px, 486px"
          src: "/getmedia/daf4b31d-e8b8-413a-867d-0269a4864080/Industry-Training-Alliance_728w.webp"
          srcset: "/getmedia/1097147f-9b4d-4795-85dd-cd2de2cab21b/Industry-Training-Alliance_362w.webp 362w, /getmedia/a2d02592-d761-4b41-b1e6-b8d358d56e65/Industry-Training-Alliance_486w.webp 486w, /getmedia/daf4b31d-e8b8-413a-867d-0269a4864080/Industry-Training-Alliance_728w.webp 728w, /getmedia/c7e651d2-7174-4b48-8be3-89ef2cb16842/Industry-Training-Alliance_972w.webp 972w, /getmedia/4d0cc3f2-79a4-4113-ba9c-4330d0625b7c/Industry-Training-Alliance_1456w.webp 1456w"

  # ─── Section 6: Get Started with I‑CAR ───────────────────────────────────────
  # Source: lines 305–330. section pb-0. textMedia left.
  # spacing.paddingBottom: none → pb-0 ✓
  # desktopMediaPosition: left — media is order-md-1 (first at md+)
  # mobileMediaOrder: below — copy is DOM-first
  # desktopGapBreakpoint: md → default target=media for left → pr-md-5 on media ✓
  #   source: pr-md-5 on media column col-10 col-md col-lg-5
  # button variant: primary (source uses btn btn-primary, not outline)
  # button target: _blank (source has target="_blank")
  # GAP: source col-md col-lg-5 on both columns (not standard equal/5-7/7-5 splits)
  # GAP: source wraps in col-xl-9 (closest: contentWidth: wide → col-lg-10 col-xl-9)
  # imageRounded: false — source image has no class; suppresses ic-image-rounded default
  - id: get-started
    type: textMedia
    imageRounded: false
    heading: "Get Started with I&#8209;CAR"
    sublabel: "Don&rsquo;t wait! Contact us today to unlock the power of training to accelerate your&nbsp;career."
    spacing:
      paddingBottom: none
    buttons:
      - label: "Contact I&#8209;CAR"
        href: "https://my.i-car.com/s/contactsupport"
        target: "_blank"
        variant: primary
    image:
      alt: "female executive on tablet"
      width: 728
      height: 900
      sizes: "(max-width: 399.9px) 362px, (max-width: 767.9px) 728px, 430px"
      src: "/getmedia/101d6470-200c-4160-8fae-fa491649e748/get-started_728w.webp"
      srcset: "/getmedia/8a39a124-2507-474a-9aee-daabb368b742/get-started_362w.webp 362w, /getmedia/aa89010c-3bbc-4e82-934e-2b529f92e1d1/get-started_430w.webp 430w, /getmedia/101d6470-200c-4160-8fae-fa491649e748/get-started_728w.webp 728w, /getmedia/83eb34c6-c3a8-48ac-863c-25e836adb212/get-started_860w.webp 860w, /getmedia/8e615e1f-c74a-4730-a5a0-a22a16dea754/get-started_1456w.webp 1456w"
    layout:
      desktopMediaPosition: left
      mobileMediaOrder: below
      desktopGapBreakpoint: md
