slug: apda
title: Industries Served - APDA
sections:

  # ─── Section 1: Hero ──────────────────────────────────────────────────────────
  # Source: lines 1–80. section_hero section_hero-banner
  # label-above pattern: h1.label (label) → p.h1 (heading) → p.subhead (sublabel)
  # pathDropdown: 10 items replacing raw has-dropdown/ul markup
  # desktopSplit: lg-5-7 (col-md col-lg-5 copy / col-md col-lg-7 media)
  # desktopGapTarget: none — source has no pr/pl gap on either column
  # mobileMediaOrder: below — media is DOM-second, no order classes needed
  # boxStyle: collapse — source .box maps to ic-box ic-box-mobile-collapse
  # imageStyle: banner — source img.banner maps to ic-image-banner
  # rowVerticalAlign: none — source row is bare (top-aligned columns); typed default centers
  # rowJustify: none — source row has no justify-content-between; typed default adds it
  # mobileMediaSpacing: tight — source has ~8px gap between columns at mobile; tight=16px
  - id: top
    type: hero
    label: "Auto Physical Damage Appraiser (APDA) Resources"
    heading: "Excel to Expert Status"
    sublabel: "For continuing education to advance your career as an insurance appraiser or adjuster, you can count on I&#8209;CAR to provide you with information and resources that guide you to&nbsp;success."
    image:
      sources:
