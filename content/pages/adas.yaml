  - id: what-is-adas
    type: textMedia
    heading: What Is ADAS?
    backgroundColor: light
    layout:
      contentWidth: wide
      desktopSplit: text-7-media-5
    paragraphs:
      - ADAS, or Advanced Driver Assistance Systems, are built-in vehicle technologies that help drivers avoid crashes and stay safe. Common features include automatic braking, lane keeping, and blind spot alerts. ADAS uses sensors and cameras to monitor surroundings and assist the driver. These systems now come standard in most new vehicles and must be properly repaired and calibrated after a&nbsp;collision.
    buttons:
      - label: Learn More
        href: /adas/what-is-adas
        variant: outline
    image:
      alt: Vehicle driving on a roadway with ADAS sensor overlays
      desktopSrc: /getmedia/fb955667-72c8-4b24-bc0a-51bbe7978e46/What-Is-ADAS_1600w_D.webp
