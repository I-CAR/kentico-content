  - id: tools
    type: iconCardGrid
    heading: Professional Tech Tools
    backgroundColor: light
    paragraphs:
      - I&#8209;CAR offers free, professional resources to support technicians. These tools help identify ADAS features, locate calibration requirements, and follow OEM procedures to make it easier to perform proper&nbsp;repairs.
    cards:
      - heading: Ask I&#8209;CAR
