slug: gold-class-marketing-kit
title: Gold Class Marketing Kit
sections:
  - id: top
    type: text
    title: Gold Class Marketing Kit
    headingTag: h1
    headingStyle: plain
    sectionChrome: bordered
    sectionSpacing: compact
    layout:
      width: full
      align: start
    body:
      - >-
        Your Gold Class and Platinum certification sets your business apart. Use the logos and materials below to
        showcase your achievement, strengthen your brand presence, and communicate your commitment to quality.
  - id: logos
    type: cards
    title: Logos
    headingStyle: plain
    sectionChrome: bordered
    sectionSpacing: compact
    variant: assetDownloads
    layout:
      introWidth: full
      introAlign: start
      contentWidth: full
      cardsPerRow:
        md: auto
      cardAlign: start
      mediaPosition: start
      mediaWrap: nowrap
      linkStyle: text
    bodyHtml:
      - >-
        Gold Class and Platinum logos can be used on letterhead, business cards, websites, estimates, and other
        marketing materials. The EPS format is ideal for embroidery or screen printing on apparel, banners, and signs,
        offering versatile ways to highlight your certification.
      - >-
        Always follow <a href="/getmedia/5e2a6752-7710-4700-acd2-6613d9491185/I-CAR-Brand-Guide_Gold-Class-and-Platinum.pdf">brand guidelines</a> for correct logo usage.
    cards:
      - title: Gold Class Collision Repair
        links:
          - label: Download Logos
            href: "/getmedia/863d8221-78e4-447e-a0bb-bf1a5ca5b781/Gold-Class-Collision-Repair-Logo.zip"
        image:
          alt: Gold Class Collision Repair logo
          desktopSrc: /getmedia/0cb42a8d-ef51-4244-b3ae-b7a1da1632ce/GoldClass_CollisionRepair_140w.webp
          width: "140"
          height: "140"
          sizes: 140px
        imagePreset: logo
      - title: Platinum Professional
