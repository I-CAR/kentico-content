    body:
      - >-
        You can play an important role in building the value of Gold Class shops by helping spread the word on social
        media. Share our posts on Facebook, Instagram, LinkedIn and X, and like and comment to keep conversations
        active and engaging.
      - Add the Gold Class logo to photos of your shop or customers to make them stand out.
