slug: ctc-travel
title: CTC Travel
sections:
  - id: top
    type: hero
    heading: Travel to the Technical Center
    headingTag: h1
    paragraphs:
      - >-
        The I&#8209;CAR Chicago Technical Center in Vernon Hills, Illinois, is about 30 miles north
        of downtown Chicago and close to O’Hare International Airport. The facility expands
        I&#8209;CAR’s technical resources with state-of-the-art labs for ADAS, EVs, and Welding,
        along with modern classrooms and a Learning Design Studio. Built by I&#8209;CAR for the
        industry, it provides an ideal setting for training, collaboration, and advancing collision
        repair&nbsp;innovation.
