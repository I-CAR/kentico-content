title: Course Updates
sections:
  - id: hero
    type: hero
    variant: split
    title: Course Updates
    inlineLinkParagraphs:
      - segments:
          - type: text
            text: "As vehicles and repair methods grow more complex, your training needs to keep pace. I&#8209;CAR&#39;s course updates&mdash;driven by the "
          - type: link
            label: Industry Knowledge &amp; Skills Protocol
            href: https://www.i-car.com/knowledge-skill-protocol-overview
          - type: text
            text: "&mdash;are designed to give professionals the support they need to stay ahead of change and deliver complete, safe, and quality repairs with confidence."
    layout:
      desktopSplit: text-5-media-7
      desktopMediaPosition: right
      mobileMediaOrder: below
      desktopGapTarget: copy
