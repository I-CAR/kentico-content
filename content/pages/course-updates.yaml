  - id: faq
    type: accordion
    title: Common Questions About Course Updates
    backgroundColor: light
    accordionId: faqAccordion
    layout:
      desktopSplit: text-5-media-7
    items:
      - title: Why is I&#8209;CAR updating courses?
        inlineLinkParagraphs:
          - segments:
              - type: text
                text: "I&#8209;CAR updates courses to keep pace with rapidly evolving vehicle technology, OEM repair requirements, and new industry standards. Updates are guided by the "
              - type: link
                label: Industry Knowledge &amp; Skills Protocol
                href: https://www.i-car.com/knowledge-skill-protocol-overview
              - type: text
                text: ", ensuring technicians receive training aligned with the necessary information professionals need to perform complete, safe, and quality repairs."
      - title: How will course updates affect my current training path?
        body:
          - Most updates are designed to fit naturally into your existing training plan towards Platinum achievement. If a course is replaced or sunset, I&#8209;CAR will provide guidance on what new course fulfills that requirement so you can stay on track toward your role progression to Platinum.
      - title: What happens if a course I&#39;m enrolled in is being replaced or retired?
        body:
          - If a course is being replaced, any earned training credit will automatically carry over to the updated version. If you have not yet finished the course, you may need to complete the new version to meet the updated training requirements.
          - If a course is being retired, please complete it and a post test, if required, before its retirement date to ensure you receive full training credit.
      - title: How long can I access a course that I completed?
        body:
          - As an I&#8209;CAR learner, you can return to any online course you&#39;ve completed at any time to refresh your knowledge&mdash;as long as that course remains active in the same format and has not been retired. If the course receives updates while it&#39;s active, you&#39;ll continue to have access to the latest version for as long as the course is available.
      - title: Where can I find all available and updated courses in one place?
        inlineLinkParagraphs:
          - segments:
              - type: text
                text: "You can browse all active courses anytime in the "
              - type: link
                label: Full Course Catalog
                href: https://www.i-car.com/browse
              - type: text
                text: " or see your personalized required courses in "
              - type: link
                label: MyLearning
                href: https://www.i-car.com/my-learning
              - type: text
                text: "."
      - title: Will the updates impact my Gold Class or Platinum recognition?
        body:
          - If a required course for your role is sunset and replaced with a new course, you will need to complete the replacement course within your recognition renewal period to maintain your Gold Class or Platinum status.
