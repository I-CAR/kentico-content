  - id: training-standards
    type: embed
    backgroundColor: light
    heading: Platinum Training Standards
    body:
      - Platinum training is structured across three levels: ProLevel&nbsp;1, 2, and 3. To maintain your Platinum status, you must complete six training course credits each year by your renewal&nbsp;date.
      - Falling behind puts your recognition at risk—but your progress isn&rsquo;t lost. Completed ProLevel credits are retained, and any missed training can be completed to reinstate&nbsp;Platinum.
    embedHtml: >-
      <figure class="cert-flow" role="img" aria-label="Flow chart showing that completing ProLevel 1, 2 and 3 results in Platinum Achieved, and completing Annual Training each year maintains Platinum status."><p>ProLevel&nbsp;1 + ProLevel&nbsp;2 + ProLevel&nbsp;3 = Platinum Achieved</p><p>Annual&nbsp;Training = Platinum Maintained</p></figure>
    pathDropdown: *platinumRoles
  - id: appraiser-changes
    type: textMedia
    variant: reverse
    label: What&rsquo;s New
    heading: Appraiser Platinum Changes
    body:
      - Starting August 2026, Auto Physical Damage Appraisers (APDAs) will need to complete ProLevel&nbsp;1, 2, and 3 training to become Platinum. This auto collision training ensures APDAs are prepared for the future of claims processing and advanced vehicle technology, staying aligned with industry&nbsp;standards.
