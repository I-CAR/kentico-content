  - id: testimonials
    type: quoteGrid
    variant: static
    heading: What Platinum Professionals Are Saying
    quotes:
      - quote: I personally have been an I&#8209;CAR individual for 23 years and it has led me to the career I am in now with all the different kinds of training available. I use I&#8209;CAR when I have an entry-level estimator or technician. I also have our CSR take classes to get familiar with the&nbsp;business.
        name: April Lausch
        title: Faulkner Collision Center of Lancaster
      - quote: Being Platinum allows me to feel more confident in the answers I am giving as I help develop and train new adjusters, many of whom were not "car people" just like I was when I started with the company. This experience has truly come full circle for me and it feels awesome to be able to contribute.
        name: Tre Forde
        title: GEICO
      - quote: I have been in the collision industry for 22 years&hellip; I have gone from sweeping floors to owning my own shop with my brother who is also Platinum status. It is always nice to have continuing education in this ever-changing field.
        name: Ryan Woodman
        title: Woodman Collision Center
      - quote: As an Auto Claims Adjuster, I&#8209;CAR has been my go-to training &amp; has helped me continue adding value in how I perform my duties with Allstate for over 21 years!
        name: Stace Long
        title: Allstate Insurance
    embed:
      src: https://players.brightcove.net/1862663934001/default_default/index.html?videoId=6373625424112
