  - id: what-is-platinum
    type: textMedia
    variant: reverse
    backgroundColor: light
    heading: What Is Platinum?
    body:
      - The Platinum designation is awarded to individuals who complete I&#8209;CAR&rsquo;s detailed, role-specific collision repair training. Whether you&rsquo;re an automotive technician, estimator, or appraiser, earning Platinum shows you understand the latest vehicle systems and repair procedures. It also helps your business earn or maintain <a href="https://info.i-car.com/gold-class" title="Learn more about Gold Class">I&#8209;CAR&rsquo;s Gold&nbsp;Class recognition</a>.
    image:
      alt: I-CAR Platinum Professional badge logo
      desktopSrc: /getmedia/06ab284e-6251-4554-8a54-1c5e174b5b11/Platinum_Professional_170w.webp
      desktopSrcset: /getmedia/06ab284e-6251-4554-8a54-1c5e174b5b11/Platinum_Professional_170w.webp 170w, /getmedia/70e82e6c-87dd-4a9a-8a87-4ffd10c313ad/Platinum_Professional_340w.webp 340w
