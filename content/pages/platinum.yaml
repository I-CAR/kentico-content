  - id: why-go-platinum
    type: stickyCards
    heading: Why Go Platinum?
    body:
      - Achieving Platinum sets you apart as a leader in auto body repair—demonstrating your expertise and commitment to excellence. As a Platinum professional, you&nbsp;will:
    cards:
      - heading: Platinum benefits
        listItems:
          - Stand out with in-depth knowledge of modern vehicle&nbsp;repairs
          - Become a key asset in your shop with trusted, current&nbsp;skills
          - Show your commitment to ongoing learning and career&nbsp;growth
          - Earn national recognition as a top performer in the&nbsp;industry
          - Position yourself for better career opportunities and&nbsp;advancement
          - Boost your confidence and credibility in your&nbsp;work
          - Receive a 20% discount on all I&#8209;CAR&nbsp;training
        image:
