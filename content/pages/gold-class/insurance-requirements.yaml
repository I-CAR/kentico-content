  - id: standards
    type: progressList
    backgroundColor: light
    heading: Standards for Gold&nbsp;Class
    paragraphs:
      - >-
        Gold&nbsp;Class signifies a company&rsquo;s progression through I&#8209;CAR&rsquo;s professional development for
        appraisers, with an annual renewal date that updates once the training is&nbsp;complete.
    groups:
      - heading: Year 1 Training Standards
        paragraphs:
          - >-
            When you enroll in the Gold&nbsp;Class program, I&#8209;CAR will assess your company&rsquo;s APDA community at the
            start of the first year. To achieve Gold&nbsp;Class status, at least 60% of your APDAs must complete
            ProLevel&nbsp;1 training by the end of this&nbsp;period.
        measures:
          - label: ProLevel&nbsp;1
            percent: 60
          - label: ProLevel&nbsp;2
            unavailable: N/A
          - label: ProLevel&nbsp;3
            unavailable: N/A
          - label: Annual Training
            unavailable: N/A
      - heading: Year 2 Training Standards
        paragraphs:
          - >-
            To maintain your Gold&nbsp;Class status for a second year, 80% of your APDA community must complete
            ProLevel&nbsp;1, and at least 50% must complete ProLevel&nbsp;2.
        measures:
          - label: ProLevel&nbsp;1
            percent: 80
          - label: ProLevel&nbsp;2
            percent: 50
          - label: ProLevel&nbsp;3
            unavailable: N/A
          - label: Annual Training
            unavailable: N/A
      - heading: Year 3 Training Standards
        paragraphs:
          - >-
            For your third-year Gold&nbsp;Class renewal, 80% of your appraisers must complete ProLevel&nbsp;1, 50% must
            complete ProLevel&nbsp;2, and at least 40% must complete ProLevel&nbsp;3.
        measures:
          - label: ProLevel&nbsp;1
            percent: 80
          - label: ProLevel&nbsp;2
            percent: 50
          - label: ProLevel&nbsp;3
            percent: 40
          - label: Annual Training
            unavailable: N/A
      - heading: Year 3+ Training Standards
        paragraphs:
          - >-
            Maintaining Gold&nbsp;Class after year three requires 80% of appraisers to complete ProLevel&nbsp;1, 50%
            must complete ProLevel&nbsp;2, 40% must complete ProLevel&nbsp;3. Additionally, at least 80% of the team
            must complete six course credits of vehicle-specific and technology-specific curriculum before the annual
            renewal&nbsp;date.
        measures:
          - label: ProLevel&nbsp;1
            percent: 80
          - label: ProLevel&nbsp;2
            percent: 50
          - label: ProLevel&nbsp;3
            percent: 40
          - label: Annual Training
            percent: 80
            supportingText: of ADPAs to complete 6 course&nbsp;credits
  - id: questions
