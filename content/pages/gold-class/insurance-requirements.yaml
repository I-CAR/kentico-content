slug: insurance-requirements
title: Gold Class - Insurance Requirements
sections:
  - id: hero
    type: hero
    variant: split
    backgroundColor: white
    heading: Gold&nbsp;Class Standards for Insurance
    paragraphs:
      - >-
        Gold&nbsp;Class for Insurance recognizes companies that have completed I&#8209;CAR&rsquo;s Professional Development
        Program for Auto Physical Damage Appraisers (APDAs). This ProLevel achievement contributes to customer
        satisfaction, efficiency, and repair&nbsp;quality.
      - >-
        As vehicles continue to evolve, adjusters can build their expertise through the APDA Platinum path, which
        includes ADAS training to improve appraisal accuracy and ensure calibrations align with OEM&nbsp;requirements.
