# Instructions for adding new files:
# 1. Add entry under 'files' section with unique key (use kebab-case)
# 2. Include all required fields: key, name, description, owner, status
# 3. Add node_map entries for important components
# 4. Create project mapping if this is a new project
# 5. Run validation: node dev/scripts/figma-registry.mjs validate
# 6. Commit changes with descriptive message
